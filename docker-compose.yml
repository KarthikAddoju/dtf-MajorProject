services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/dtf
      - PORT=4000
      # PINATA_JWT and others must be provided via a .env file or environment
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env.local
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-http://127.0.0.1:8545}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-31337}
        NEXT_PUBLIC_POCT_ADDRESS: ${NEXT_PUBLIC_POCT_ADDRESS:-0x0000000000000000000000000000000000000001}
        NEXT_PUBLIC_EDU_ADDRESS: ${NEXT_PUBLIC_EDU_ADDRESS:-0x0000000000000000000000000000000000000002}
        NEXT_PUBLIC_MINT_CONTROLLER_ADDRESS: ${NEXT_PUBLIC_MINT_CONTROLLER_ADDRESS:-0x0000000000000000000000000000000000000003}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL:-http://127.0.0.1:8545}
      - NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID:-31337}
      - NEXT_PUBLIC_POCT_ADDRESS=${NEXT_PUBLIC_POCT_ADDRESS:-0x0000000000000000000000000000000000000001}
      - NEXT_PUBLIC_EDU_ADDRESS=${NEXT_PUBLIC_EDU_ADDRESS:-0x0000000000000000000000000000000000000002}
      - NEXT_PUBLIC_MINT_CONTROLLER_ADDRESS=${NEXT_PUBLIC_MINT_CONTROLLER_ADDRESS:-0x0000000000000000000000000000000000000003}
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped

volumes:
  mongodb_data:
